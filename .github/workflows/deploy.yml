
name: Deploy Intelligent Task Management

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production deployments.
concurrency:
  group: intelligent-task-management-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Backend Tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run automated backend tests
        run: npm test
        working-directory: backend

  deploy:
    name: Deploy on EC2
    runs-on: [self-hosted, Linux, X64]
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application with rollback
        shell: bash
        run: |
          set -euo pipefail

          cd /home/ubuntu/intelligent-task-management

          SHORT_SHA="${GITHUB_SHA:0:7}"
          BACKUP_TAG="rollback-${SHORT_SHA}-$(date -u +%Y%m%d%H%M%S)"

          BACKEND_IMAGE="intelligent-task-management-backend"
          FRONTEND_IMAGE="intelligent-task-management-frontend"

          echo "Fetching latest GitHub changes..."
          git fetch origin master

          echo "Updating EC2 project..."
          git merge --ff-only origin/master

          echo "Validating production configuration..."
          docker compose -f docker-compose.prod.yml config --quiet

          echo "Saving currently working Docker images..."
          docker tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}:${BACKUP_TAG}"
          docker tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:${BACKUP_TAG}"

          check_health() {
            for attempt in {1..12}; do
              echo "Checking frontend and backend... ($attempt/12)"

              if curl --fail --silent --show-error http://localhost:8080/ --output /dev/null; then

                API_RESPONSE="$(curl --fail --silent --show-error http://localhost:8080/api/health)" || API_RESPONSE=""

                if [[ "$API_RESPONSE" == *'"success":true'* ]]; then
                  echo "Frontend health check passed."
                  echo "Backend API health check passed."
                  return 0
                fi
              fi

              echo "Application not fully ready. Retrying in 5 seconds..."
              sleep 5
            done

            echo "Frontend or backend health check failed."
            return 1
          }

          rollback() {
            echo "Deployment failed. Starting rollback..."

            docker tag "${BACKEND_IMAGE}:${BACKUP_TAG}" "${BACKEND_IMAGE}:latest"
            docker tag "${FRONTEND_IMAGE}:${BACKUP_TAG}" "${FRONTEND_IMAGE}:latest"

            echo "Recreating containers with previous images..."
            docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate

            echo "Checking rollback health..."
            if check_health; then
              echo "Rollback successful. Previous application restored."
            else
              echo "WARNING: Rollback health check failed. Manual investigation required."
            fi
          }

          echo "Building and deploying new version..."
          if ! docker compose -f docker-compose.prod.yml up -d --build; then
            echo "Build or deployment failed."
            rollback
            exit 1
          fi

          echo "Checking new deployment health..."
          if ! check_health; then
            echo "New deployment health check failed."
            rollback
            exit 1
          fi

          echo "Tagging successful deployment..."
          docker tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}:${SHORT_SHA}"
          docker tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:${SHORT_SHA}"

          echo "Checking production containers..."
          docker compose -f docker-compose.prod.yml ps

          echo "Deployment successful!"
          echo "Version: ${SHORT_SHA}"
          echo "Rollback backup: ${BACKUP_TAG}"
